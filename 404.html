<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game over — Amir Choudhary</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070912">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap">
<style>
  :root{--bg:#070912;--panel:#0e1222;--line2:#2f3a6a;--tx:#e8ecf7;--mut:#8b94ad;--cyan:#19e3ff;--mag:#ff3d8a;--lime:#9cff3d;--gold:#ffc83d;
    --px:'Press Start 2P',monospace;--mn:'Share Tech Mono',ui-monospace,monospace;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(ellipse at 50% 110%,#160b2c,var(--bg) 60%);color:var(--tx);font-family:var(--mn);
    display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left));text-align:center;overflow:hidden}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
  .grid{position:fixed;left:-50vw;right:-50vw;bottom:0;height:45vh;pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(25,227,255,.14) 0 1px,transparent 1px 80px),repeating-linear-gradient(0deg,rgba(25,227,255,.14) 0 1px,transparent 1px 50px);
    transform:perspective(400px) rotateX(60deg);transform-origin:50% 0;mask-image:linear-gradient(180deg,transparent,#000 40%);-webkit-mask-image:linear-gradient(180deg,transparent,#000 40%)}
  main{position:relative;max-width:640px;padding:40px 24px;background:rgba(14,18,34,.85);border:1px solid var(--line2);box-shadow:0 0 0 4px var(--bg),0 0 0 5px #232a4a}
  main::before,main::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cyan)}
  main::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
  main::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
  .code{font-size:14px;letter-spacing:3px;color:var(--mag)}
  h1{font-family:var(--px);font-size:clamp(26px,7vw,48px);line-height:1.3;margin:18px 0 10px;color:var(--tx);text-shadow:4px 4px 0 var(--mag),8px 8px 0 #2a0d3a}
  p{margin:0;color:var(--mut);font-size:17px;line-height:1.6}
  .cont{margin-top:26px;font-family:var(--px);font-size:14px;color:var(--gold)}
  .cont b{display:inline-block;min-width:2ch;color:var(--lime);font-weight:400;font-variant-numeric:tabular-nums}
  .blink{animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
  a.btn{font-family:var(--px);font-size:10px;letter-spacing:.5px;text-transform:uppercase;text-decoration:none;padding:14px 18px;border:2px solid var(--cyan);color:var(--cyan);background:var(--bg);transition:transform .15s,box-shadow .15s}
  a.btn:hover,a.btn:focus-visible{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--cyan);outline:none}
  a.btn.solid{background:var(--cyan);color:#041018}
  a.btn.mag{border-color:var(--mag);color:var(--mag)}
  a.btn.mag:hover{box-shadow:4px 4px 0 var(--mag)}
  .path{margin-top:22px;font-size:13px;color:#727d9e;word-break:break-all}
  @media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<main>
  <div class="code">ERROR 404 · LEVEL NOT FOUND</div>
  <h1>GAME OVER</h1>
  <p>This screen does not exist in the cartridge. The page may have moved, or the link had a typo.</p>
  <div class="cont">CONTINUE? <b id="n">9</b><span class="blink">▌</span></div>
  <div class="btns">
    <a class="btn solid" href="/">▶ Title screen</a>
    <a class="btn" href="/#levels">Select level</a>
    <a class="btn mag" href="/#coop">Join party</a>
  </div>
  <div class="path" id="path"></div>
</main>
<script>
  // countdown just for show; the player picks where to go
  var n = 9, el = document.getElementById('n');
  var t = setInterval(function () { n--; el.textContent = n; if (n <= 0) { clearInterval(t); el.textContent = 'INSERT COIN'; } }, 1000);
  document.getElementById('path').textContent = 'route: ' + location.pathname;
</script>
</body>
</html>
